<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pack verano jugando en inglés · Nivel 3</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Nunito:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#1d2147;--p:#7c3aed;--ok:#22c55e;--bad:#ef4444;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:inherit}
body{margin:0;min-height:100vh;font-family:Nunito,system-ui,sans-serif;color:#fff;background:linear-gradient(160deg,#1b1464,#6d28d9 55%,#0f7c8c);background-attachment:fixed;overflow-x:hidden}
header{text-align:center;padding:18px 10px 6px}
h1{font-family:"Baloo 2",system-ui,sans-serif;font-weight:800;margin:0;line-height:1.05;color:#fff;letter-spacing:1px}
h1 .l1{display:block;font-size:clamp(2rem,8vw,4rem);text-shadow:0 0 2px #fff,0 0 8px #ff4fd8,0 0 20px #ff4fd8,0 0 38px #ff4fd8}
h1 .l2{display:block;font-size:clamp(1.6rem,6.5vw,3.2rem);text-shadow:0 0 2px #fff,0 0 8px #00e5ff,0 0 20px #00e5ff,0 0 38px #00b8ff}
h1 .l3{display:inline-block;margin-top:6px;font-size:clamp(1rem,4vw,1.8rem);padding:2px 16px;border-radius:30px;border:2px solid #ffe66d;text-shadow:0 0 2px #fff,0 0 10px #ffd23f,0 0 20px #ffb300;box-shadow:0 0 12px #ffd23f,inset 0 0 10px #ffd23f55;animation:fl 3s infinite}
@keyframes fl{0%,100%{opacity:1}92%{opacity:1}94%{opacity:.7}96%{opacity:1}}
.bg{position:fixed;inset:0;pointer-events:none;z-index:0}
.bg i{position:absolute;font-style:normal;font-size:2rem;opacity:.25;animation:fy 9s ease-in-out infinite}
@keyframes fy{50%{transform:translateY(-26px) rotate(12deg)}}
nav{position:relative;z-index:2;display:flex;gap:8px;overflow-x:auto;padding:10px 12px;margin:0 auto;max-width:1100px;justify-content:safe center;scrollbar-width:thin}
nav button{flex:0 0 auto;min-width:74px;border:0;border-radius:16px;padding:8px 10px;font:800 .78rem Nunito,sans-serif;color:#fff;background:#ffffff26;cursor:pointer;transition:.2s}
nav button b{display:block;font-size:1.5rem;font-weight:400}
nav button:hover{transform:translateY(-3px);background:#ffffff40}
nav button.on{background:linear-gradient(135deg,#ff4fd8,#ff9f1c);box-shadow:0 0 14px #ff4fd8}
main{position:relative;z-index:1;max-width:880px;margin:0 auto;padding:8px 14px 40px}
h2{font-family:"Baloo 2",sans-serif;font-size:clamp(1.5rem,5vw,2.2rem);margin:8px 0 2px;text-shadow:0 2px 0 #0004}
.lead{margin:0 0 14px;font-size:1.05rem;opacity:.95}
.card{background:#fff;color:var(--ink);border-radius:22px;padding:16px;margin-bottom:14px;box-shadow:0 8px 24px #0004;animation:pop .4s both}
@keyframes pop{from{transform:scale(.92);opacity:0}}
.btn{border:0;border-radius:14px;padding:10px 16px;font:800 1rem Nunito,sans-serif;color:#fff;cursor:pointer;background:linear-gradient(135deg,#7c3aed,#06b6d4);box-shadow:0 4px 0 #0003;transition:.15s}
.btn:active{transform:translateY(3px) scale(.96);box-shadow:none}
.btn.go{background:linear-gradient(135deg,#ff9f1c,#ff4fd8)}
.btn.sm{padding:6px 10px;font-size:.85rem}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.msg{font-weight:800;min-height:1.4em;margin:8px 0 0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}
.big{font-size:3rem;line-height:1}
.en{font-weight:800;color:#6d28d9}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{border:3px solid #e5e7eb;background:#f8f9ff;border-radius:14px;padding:10px 16px;font:800 1.1rem Nunito,sans-serif;color:var(--ink);cursor:pointer}
.opt.sel{border-color:var(--p);background:#ede9fe}
.opt.ok{border-color:var(--ok);background:#bbf7d0}
.opt.no{border-color:var(--bad);background:#fecaca}
.scene{font-size:2.2rem}
select{font:800 1.4rem Nunito,sans-serif;border-radius:12px;padding:6px;border:3px solid #e5e7eb;color:var(--ink);background:#f8f9ff}
select.ok{border-color:var(--ok);background:#bbf7d0}select.no{border-color:var(--bad);background:#fecaca}
.tray{min-height:54px;display:flex;flex-wrap:wrap;gap:8px;padding:8px;border-radius:14px;background:#eef2ff;margin:8px 0}
.tray.ans{border:2px dashed #a5b4fc}.tray.ok{background:#bbf7d0}.tray.no{background:#fecaca}
.ws{display:grid;grid-template-columns:repeat(8,1fr);gap:4px;max-width:420px;margin:auto}
.ws button{aspect-ratio:1;border:0;border-radius:10px;background:#eef2ff;color:var(--ink);font:800 clamp(1rem,5vw,1.5rem) Nunito,sans-serif;cursor:pointer;padding:0}
.ws button.st{outline:3px solid var(--p);background:#ddd6fe}
.words{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-bottom:12px}
.words span{background:#ede9fe;border-radius:20px;padding:4px 12px;font-weight:800;color:#5b21b6}
.words span.f{text-decoration:line-through;background:#bbf7d0;color:#166534}
.mem{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.mem button{aspect-ratio:.85;border:0;border-radius:14px;font:800 clamp(.8rem,3.4vw,1.2rem) Nunito,sans-serif;background:linear-gradient(135deg,#7c3aed,#ff4fd8);color:#fff;cursor:pointer;padding:2px}
.mem button.o{background:#fff7ed;color:var(--ink);border:3px solid #ff9f1c}
.mem button.d{background:#bbf7d0;color:var(--ink);border:3px solid var(--ok)}
.mem .e{font-size:clamp(1.6rem,8vw,2.8rem)}
.stage{position:relative;max-width:340px;margin:auto}
.aura{position:absolute;inset:6% 6%;border-radius:50%;background:radial-gradient(#ff4fd888,#ffd23f33 55%,transparent 70%);animation:pu 2s ease-in-out infinite}
@keyframes pu{50%{transform:scale(1.15);opacity:.6}}
.pop{position:relative;width:100%;height:auto;filter:drop-shadow(0 0 12px #ff4fd8)}
.pop.win{animation:wob .6s infinite alternate;filter:drop-shadow(0 0 26px #ffd23f)}
@keyframes wob{to{transform:rotate(4deg) scale(1.05)}}
.drip{animation:dr 1.2s ease-in forwards}
@keyframes dr{to{transform:translateY(var(--dy));opacity:.2}}
.sp{position:absolute;animation:tw 1.6s ease-in-out infinite;pointer-events:none}
@keyframes tw{50%{transform:scale(1.6) rotate(25deg);opacity:.3}}
.word{display:flex;justify-content:center;gap:6px;flex-wrap:wrap;margin:6px 0}
.word b{width:2.1rem;height:2.6rem;border-bottom:4px solid var(--p);text-align:center;font:800 1.7rem Nunito,sans-serif;color:var(--ink)}
.keys{display:grid;grid-template-columns:repeat(auto-fill,minmax(2.4rem,1fr));gap:6px}
.keys button{border:0;border-radius:10px;padding:8px 0;font:800 1rem Nunito,sans-serif;background:#ede9fe;color:var(--ink);cursor:pointer}
.keys button.ok{background:#86efac}.keys button.no{background:#fca5a5}.keys button:disabled{cursor:default}
.foot{display:flex;justify-content:space-between;gap:8px;margin-top:10px}
.sunG .rays,.ripple,.bub,.fw,.splash{transform-box:fill-box;transform-origin:center}
.rays{animation:spin 12s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.ripple{animation:rip 2.4s ease-out infinite}
@keyframes rip{from{transform:scale(.3);opacity:.9}to{transform:scale(1.15);opacity:0}}
.bub{animation:bub 3.2s ease-in infinite}
@keyframes bub{from{transform:translateY(0);opacity:0}25%{opacity:.8}to{transform:translateY(-110px);opacity:0}}
.fw,.splash{animation:fw 1.3s ease-out forwards}
@keyframes fw{from{transform:translate(0,0) scale(1);opacity:1}to{transform:translate(var(--dx),var(--dy)) scale(.2);opacity:0}}
.stage.win .aura{background:conic-gradient(#ff4fd8,#ffd23f,#22c55e,#06b6d4,#7c3aed,#ff4fd8);filter:blur(22px);opacity:.8;animation:spin 3s linear infinite}
.stage.lost .pop{animation:shk .45s 3}
@keyframes shk{25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
.cf{position:fixed;top:-14px;width:10px;height:14px;z-index:50;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(112vh) rotate(720deg)}}
.rule{display:grid;grid-template-columns:1fr 1fr;gap:10px}.rule div{border-radius:16px;padding:12px;color:#fff}
@media(max-width:560px){.rule{grid-template-columns:1fr}}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01s!important}}
</style></head>
<body>
<div class="bg" id="bg"></div>
<header><h1><span class="l1">Pack verano</span><span class="l2">jugando en inglés</span><span class="l3">Nivel 3 · There is y There are</span></h1></header>
<nav id="menu" aria-label="Secciones"></nav>
<main id="main"></main>
<script>
"use strict";
/* ---------- utilidades ---------- */
const shuffle=a=>{const r=[...a];for(let i=r.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[r[i],r[j]]=[r[j],r[i]];}return r;};
const el=(tag,cls="",html="")=>{const n=document.createElement(tag);n.className=cls;n.innerHTML=html;return n;};
const mark=(node,good)=>{node.classList.remove("ok","no");node.classList.add(good?"ok":"no");};

/* ---------- servicios: sonidos, voz, confeti ---------- */
const Sfx={ctx:null,
 tone(f,d=.15,type="sine",at=0,v=.15){try{this.ctx=this.ctx||new(window.AudioContext||window.webkitAudioContext)();const c=this.ctx;if(c.state==="suspended")c.resume();const t=c.currentTime+at,o=c.createOscillator(),g=c.createGain();o.type=type;o.frequency.value=f;g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(c.destination);o.start(t);o.stop(t+d);}catch(e){}},
 pop(){this.tone(520,.08,"triangle")},
 ok(){[523,659,784].forEach((f,i)=>this.tone(f,.18,"triangle",i*.09))},
 bad(){this.tone(200,.25,"sawtooth",0,.08);this.tone(150,.3,"sawtooth",.12,.08)},
 win(){[523,659,784,1047,784,1047].forEach((f,i)=>this.tone(f,.2,"square",i*.1,.07))}};

const Voice={
 pick(lang){const v=window.speechSynthesis.getVoices();return v.find(x=>x.lang.replace("_","-")===lang)||v.find(x=>x.lang.slice(0,2)===lang.slice(0,2));},
 say(parts){if(!("speechSynthesis" in window))return;speechSynthesis.cancel();
  const q=[].concat(parts).map(p=>typeof p==="string"?[p,"en-US"]:p);
  const next=()=>{const x=q.shift();if(!x)return;const u=new SpeechSynthesisUtterance(x[0]);u.lang=x[1];const v=this.pick(x[1]);if(v)u.voice=v;u.rate=x[1]==="en-US"?.85:.95;u.onend=next;speechSynthesis.speak(u);};next();},
 stop(){if("speechSynthesis" in window)speechSynthesis.cancel();}};

const Confetti={burst(n=70){const c=["#ff4fd8","#ffd23f","#06b6d4","#22c55e","#7c3aed"];
 for(let i=0;i<n;i++){const s=el("i","cf");s.style.cssText=`left:${Math.random()*100}vw;background:${c[i%5]};animation-duration:${2+Math.random()*2}s;animation-delay:${Math.random()*.6}s`;document.body.appendChild(s);setTimeout(()=>s.remove(),4800);}}};

/* ---------- datos ---------- */
const ITEMS=[
 {w:"shell",e:"🐚",es:"concha",s:"There is a shell.",p:"There are two shells."},
 {w:"crab",e:"🦀",es:"cangrejo",s:"There is a crab.",p:"There are two crabs."},
 {w:"boat",e:"⛵",es:"bote",s:"There is a boat.",p:"There are two boats."},
 {w:"ball",e:"🏐",es:"pelota",s:"There is a ball.",p:"There are two balls."},
 {w:"umbrella",e:"⛱️",es:"sombrilla",s:"There is an umbrella.",p:"There are two umbrellas."},
 {w:"sun",e:"☀️",es:"sol",s:"There is a sun.",p:"There are two suns."},
 {w:"fish",e:"🐠",es:"pez (peces)",s:"There is a fish.",p:"There are two fish."},
 {w:"palm tree",e:"🌴",es:"palmera",s:"There is a palm tree.",p:"There are two palm trees."}];
const Score={};

/* ---------- juego genérico de opciones (quiz, escucha, verdadero/falso) ---------- */
function choiceGame(root,id,qs){
 const picks=Array(qs.length).fill(null),boxes=[];
 qs.forEach((q,i)=>{
  const box=el("div","card",`<p><b>${i+1}.</b> ${q.t}</p>`);
  if(q.say){const b=el("button","btn sm","🔊 Escuchar");b.onclick=()=>Voice.say(q.say);box.append(b);}
  const opts=el("div","opts");opts.style.marginTop="10px";
  q.o.forEach((txt,j)=>{const b=el("button","opt",txt);
   b.onclick=()=>{picks[i]=j;[...opts.children].forEach(x=>x.classList.remove("sel","ok","no"));b.classList.add("sel");Sfx.pop();};
   opts.append(b);});
  box.append(opts);root.append(box);boxes.push(opts);});
 const msg=el("p","msg"),v=el("button","btn go","✔️ Verificar mis respuestas");
 v.onclick=()=>{if(picks.includes(null)){msg.textContent="Responde todas las preguntas primero 😉";Sfx.bad();return;}
  let good=0;picks.forEach((p,i)=>{const okk=p===qs[i].a;if(okk)good++;mark(boxes[i].children[p],okk);});
  Score[id]=[good,qs.length];
  if(good===qs.length){msg.textContent="🎉 ¡Todo correcto! ¡Excelente!";Sfx.win();Confetti.burst();}
  else{msg.textContent=`Llevas ${good} de ${qs.length}. Cambia las respuestas marcadas con ❌ e inténtalo otra vez 💪`;Sfx.bad();}};
 root.append(v,msg);
}

/* ---------- secciones ---------- */
const Sections=[];
const add=(icon,label,lead,render)=>Sections.push({icon,label,lead,render});

add("🏠","Inicio","¡Bienvenido! Lee la explicación o escúchala con el botón.",root=>{
 const es="es-CL";
 root.append(el("div","card",`<p>En inglés, para decir que <b>algo existe o está en un lugar</b> usamos <b>there is</b> y <b>there are</b>. Los dos significan <b>“hay”</b>.</p>
 <div class="rule"><div style="background:#7c3aed"><h3>☝️ There is</h3><p>Se usa cuando hay <b>UNA sola cosa</b>.</p><p class="big" style="font-size:2rem">🦀</p><p>There is a crab.<br><small>Hay un cangrejo.</small></p></div>
 <div style="background:#0891b2"><h3>✌️ There are</h3><p>Se usa cuando hay <b>DOS o más cosas</b>.</p><p class="big" style="font-size:2rem">🦀🦀</p><p>There are two crabs.<br><small>Hay dos cangrejos.</small></p></div></div>
 <p>👀 Fíjate: con <b>there are</b> la palabra casi siempre termina en <b>-s</b> (shell → shells). ¡Ojo! <b>fish</b> no cambia: one fish, two fish.</p>
 <div style="background:#fff7ed;border:3px solid #ff9f1c;border-radius:16px;padding:12px;margin:10px 0"><h3>🔤 Una sola cosa: one, a o an</h3>
 <p>Para hablar de <b>una sola cosa</b> puedes usar <b>one</b> (uno) o <b>a / an</b> (un, una). Significan lo mismo:</p>
 <p><b class="en">There is one crab. = There is a crab.</b></p>
 <p><b>¿Cuándo uso a y cuándo an?</b> Depende del <b>sonido</b> con que empieza la palabra siguiente:</p>
 <p>✅ <b>an</b> → si empieza con <b>sonido de vocal</b> (a, e, i, o, u): <span class="en">an umbrella, an apple, an egg</span>.</p>
 <p>✅ <b>a</b> → si empieza con <b>sonido de consonante</b>: <span class="en">a crab, a shell, a boat</span>.</p>
 <p>🤔 <b>¿Por qué?</b> Porque decir “a umbrella” se oye difícil, con dos sonidos de vocal juntos. Al agregar la <b>n</b> las palabras se unen fácil: “a-<b>n</b>-umbrella”. ¡Es para que sea más cómodo pronunciar!</p>
 <p>👀 Ojo: importa el <b>sonido</b>, no solo la letra. Por ejemplo: <span class="en">an hour</span> (la h no suena) y <span class="en">a university</span> (suena como “yu”).</p></div>
 <p>Hoy aprenderás vocabulario de la playa y practicarás con 9 juegos. ¡Vamos a jugar! ☀️</p>`));
 const b=el("button","btn","🔊 Escuchar la explicación");
 b.onclick=()=>Voice.say([["En inglés, para decir que algo existe o está en un lugar, usamos ",es],["there is",],["y ",es],"there are",["Los dos significan hay. Usamos ",es],"there is",["cuando hay una sola cosa. Por ejemplo: ",es],"There is a crab.",["Usamos ",es],"there are",["cuando hay dos o más cosas. Por ejemplo: ",es],"There are two crabs.",["Fíjate que con plural la palabra casi siempre termina en ese.",es],["Para una sola cosa también puedes usar a o an, en lugar de one. Usamos an cuando la palabra empieza con sonido de vocal. Por ejemplo: ",es],"an umbrella.",["Y usamos a cuando empieza con sonido de consonante. Por ejemplo: ",es],"a crab.",["Usamos an porque así es más fácil de pronunciar, sin juntar dos sonidos de vocal.",es]].map(p=>p.length===1?p[0]:p));
 root.append(b);});

add("📚","Vocabulario","Toca los botones 🔊 para escuchar cada palabra y cada oración.",root=>{
 const g=el("div","grid");
 ITEMS.forEach(it=>{const c=el("div","card",`<div class="big">${it.e}</div><h3 class="en">${it.w}</h3><p>${it.es}</p><p>${it.s}<br>${it.p}</p>`);
  [["🔊 Palabra",it.w],["🔊 There is",it.s],["🔊 There are",it.p]].forEach(([t,s])=>{const b=el("button","btn sm",t);b.style.margin="2px";b.onclick=()=>Voice.say(s);c.append(b);});
  g.append(c);});
 root.append(g);});

add("🧠","Quiz","Elige is o are para completar cada oración y pulsa Verificar.",root=>{
 choiceGame(root,"Quiz",[
  {t:"There ___ a sun in the sky. ☀️",o:["is","are"],a:0},
  {t:"There ___ three crabs on the sand. 🦀🦀🦀",o:["is","are"],a:1},
  {t:"There ___ an umbrella on the beach. ⛱️",o:["is","are"],a:0},
  {t:"There ___ two boats in the sea. ⛵⛵",o:["is","are"],a:1},
  {t:"There ___ four shells. 🐚🐚🐚🐚",o:["is","are"],a:1}]);});

add("🔗","Emparejar","Elige en cada lista el dibujo que corresponde a la palabra y pulsa Verificar.",root=>{
 const list=ITEMS.slice(0,6),emojis=shuffle(list.map(i=>i.e)),sels=[];
 const card=el("div","card");
 list.forEach(it=>{const row=el("div","row");row.style.margin="8px 0";
  const s=el("select","","<option value=''>¿Cuál es?</option>"+emojis.map(e=>`<option>${e}</option>`).join(""));
  s.onchange=()=>{s.classList.remove("ok","no");Sfx.pop();};sels.push(s);
  const b=el("button","btn sm","🔊");b.onclick=()=>Voice.say(it.w);
  row.append(b,el("b","en",it.w),s);card.append(row);});
 const msg=el("p","msg"),v=el("button","btn go","✔️ Verificar");
 v.onclick=()=>{if(sels.some(s=>!s.value)){msg.textContent="Completa todas las parejas 😉";Sfx.bad();return;}
  let good=0;sels.forEach((s,i)=>{const o=s.value===list[i].e;if(o)good++;mark(s,o);});Score["Emparejar"]=[good,list.length];
  if(good===list.length){msg.textContent="🎉 ¡Todas correctas!";Sfx.win();Confetti.burst();}else{msg.textContent=`Tienes ${good} de ${list.length}. Corrige las que están en rojo 💪`;Sfx.bad();}};
 card.append(v,msg);root.append(card);});

add("🔀","Revoltijo","Toca las palabras para ordenar cada oración. Toca una palabra de arriba para devolverla.",root=>{
 const S=[{w:["There","are","three","shells"],es:"Hay tres conchas."},{w:["There","is","a","crab"],es:"Hay un cangrejo."},
  {w:["There","are","two","boats"],es:"Hay dos botes."},{w:["There","is","an","umbrella"],es:"Hay una sombrilla."}];
 const total=S.length;let good=0;const results={};
 S.forEach((s,k)=>{const st={pool:[],ans:[]};
  do{st.pool=shuffle(s.w);}while(st.pool.join(" ")===s.w.join(" "));
  const card=el("div","card",`<p>🇨🇱 ${s.es}</p>`),ans=el("div","tray ans"),pool=el("div","tray"),msg=el("p","msg");
  const draw=()=>{[[ans,st.ans,st.pool],[pool,st.pool,st.ans]].forEach(([tray,from,to])=>{tray.innerHTML="";
    from.forEach((w,i)=>{const b=el("button","opt",w);b.onclick=()=>{from.splice(i,1);to.push(w);ans.classList.remove("ok","no");Sfx.pop();draw();};tray.append(b);});});};
  const v=el("button","btn go","✔️ Verificar"),h=el("button","btn sm","🔊 Escuchar");
  h.style.marginLeft="8px";h.onclick=()=>Voice.say(st.ans.join(" ")||"Choose the words");
  v.onclick=()=>{const okk=st.ans.join(" ")===s.w.join(" ");mark(ans,okk);results[k]=okk;
   msg.textContent=okk?"✅ ¡Muy bien!":"❌ Aún no. ¡Inténtalo otra vez!";okk?Sfx.ok():Sfx.bad();
   Score["Revoltijo"]=[Object.values(results).filter(Boolean).length,total];
   if(Object.values(results).filter(Boolean).length===total)Confetti.burst();};
  draw();card.append(ans,pool,v,h,msg);root.append(card);});});

add("🔍","Sopa de letras","Toca la primera y la última letra de cada palabra. Hay palabras horizontales (→) y verticales (↓).",root=>{
 const W=[["BEACH",0,0,0,1],["SHELL",2,0,0,1],["CRAB",4,0,0,1],["BALL",6,0,0,1],["SAND",0,5,1,0],["BOAT",0,7,1,0],["SUN",4,6,1,0]];
 const N=8,pal=["#fca5a5","#fdba74","#fde047","#86efac","#67e8f9","#a5b4fc","#f0abfc"];
